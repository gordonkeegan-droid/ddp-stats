name: Update Savant Stats

on:
  schedule:
    - cron: '0 13 * * *'   # daily 9:00 AM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Savant pitcher stats
        run: python fetch_savant.py

      - name: Build HR player distributions
        run: python build_players.py

      - name: Verify outputs exist
        run: |
          for f in pitcher_stats.json players.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not created"
              exit 1
            fi
            echo "$f size: $(wc -c < $f) bytes"
          done

      - name: Commit updated stats
        run: |
          git config user.name "ddp-bot"
          git config user.email "actions@github.com"
          git add pitcher_stats.json players.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update pitcher stats + HR players $(date -u +%Y-%m-%d)"
            git push
          fi
